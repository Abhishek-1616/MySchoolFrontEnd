
name: Frontend CI CD

on:
  push:
    branches: [develop, main]

  pull_request:
    branches: [develop, main]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Frontend Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: marketingWebsite

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Configure Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: marketingWebsite/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests if configured
        run: npm run test --if-present

      - name: Build frontend
        run: npm run build

      - name: Verify build
        run: test -s dist/index.html

      - name: Security audit
        run: npm audit --audit-level=high

  deploy:
    name: Deploy Frontend to EC2
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 25

    if: |
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch') &&
      vars.FRONTEND_DEPLOY_ENABLED == 'true'

    permissions:
      contents: read
      id-token: write

    concurrency:
      group: school-frontend-deployment
      cancel-in-progress: false

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Deploy through SSM
        shell: bash
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name School-Deploy-Frontend \
            --parameters "CommitSha=$COMMIT_SHA" \
            --comment "Frontend deployment $COMMIT_SHA" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for attempt in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID"
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID"
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Deployment verification timed out"
          exit 1

      - name: Verify public HTTPS website
        run: |
          curl -fsS --retry 3 \
            --max-time 20 \
            https://school.myschool4u.in/ \
            -o /dev/null
