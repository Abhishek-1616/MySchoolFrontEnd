name: Frontend CI CD

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  ci:
    name: Frontend Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: marketingWebsite

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: marketingWebsite/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx --no-install eslint .

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Run frontend tests
        run: npm run test --if-present

      - name: Build application
        run: npm run build

      - name: Verify compiled application
        run: test -s dist/index.html

  deploy:
    name: Deploy Frontend to EC2
    needs: ci

    if: >
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch')

    runs-on: ubuntu-latest
    timeout-minutes: 120

    concurrency:
      group: school-frontend-deployment
      cancel-in-progress: false

    permissions:
      contents: read
      id-token: write

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: Frontend-${{ github.run_id }}
          role-duration-seconds: 7200
          retry-max-attempts: 3

      - name: Verify AWS connection
        run: aws sts get-caller-identity

      - name: Execute frontend deployment
        id: ssm
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name School-Deploy-Frontend \
            --parameters "CommitSha=$GITHUB_SHA" \
            --timeout-seconds 600 \
            --query 'Command.CommandId' \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "SSM command: $COMMAND_ID"

      - name: Monitor deployment
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          COMMAND_ID: ${{ steps.ssm.outputs.command_id }}
        run: |
          set -euo pipefail

          for i in $(seq 1 500); do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null) || STATUS="Pending"

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query StandardOutputContent \
                  --output text
                exit 0
                ;;

              Pending|InProgress|Delayed|Cancelling)
                sleep 10
                ;;

              *)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID"
                exit 1
                ;;
            esac

          done

          echo "Deployment monitoring timed out"
          exit 1

      - name: Verify public website
        run: |
          curl -fsS \
            --retry 3 \
            --max-time 30 \
            https://school.myschool4u.in/ \
            -o /dev/null

      - name: Deployment summary
        run: |
          echo "## Frontend Deployment Successful" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Website: https://school.myschool4u.in/" >> "$GITHUB_STEP_SUMMARY"
