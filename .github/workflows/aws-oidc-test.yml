
name: Test AWS OIDC Connection

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify-aws:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Inspect OIDC subject
        shell: bash
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, base64
          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          sep = "&" if "?" in url else "?"
          req = urllib.request.Request(
              url + sep + "audience=sts.amazonaws.com",
              headers={"Authorization": "Bearer " +
                       os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]}
          )
          token = json.load(urllib.request.urlopen(req))["value"]
          payload = token.split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(
              payload + "=" * (-len(payload) % 4)
          ))
          print("OIDC subject:", claims["sub"])
          print("OIDC audience:", claims["aud"])
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GitHubOIDCTest

      - name: Verify AWS connection
        run: aws sts get-caller-identity
